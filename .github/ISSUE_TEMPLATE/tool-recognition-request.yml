name: Tool recognition request
description: Request support for a build or test tool that MemoryGuard does not recognize yet.
title: "[Tool]: "
labels:
  - tool request
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping MemoryGuard recognize more developer tools.

        Before submitting, remove usernames, project names, private paths, tokens, keys, and other sensitive data from logs or command lines.

  - type: input
    id: tool-name
    attributes:
      label: Tool name
      description: What build, test, compiler, or package tool was not recognized?
      placeholder: "Example: xcodebuild"
    validations:
      required: true

  - type: input
    id: official-url
    attributes:
      label: Official project URL
      description: Link to the tool's official website or source repository.
      placeholder: https://example.com/tool
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Build tool
        - Test runner
        - Compiler
        - Package manager
        - Other
    validations:
      required: true

  - type: textarea
    id: sanitized-command
    attributes:
      label: Sanitized process command
      description: Paste the command MemoryGuard missed. Replace personal or project paths with placeholders and never include secrets.
      placeholder: /usr/bin/tool <PROJECT_PATH> --build
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Describe the shortest safe sequence that starts the tool and shows the missed activity.
      placeholder: |
        1. Open the project.
        2. Run the build command.
        3. Open MemoryGuard and check Activity.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Mac and MemoryGuard versions
      description: Include macOS version, Apple silicon or Intel, and MemoryGuard version.
      placeholder: macOS 15.5, Apple M2, MemoryGuard 1.3.1
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing Issues for this tool.
          required: true
        - label: I removed secrets, usernames, project names, and private paths from everything above.
          required: true
